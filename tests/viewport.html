<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Studio responsive checks</title><style>body{margin:0;background:#ddd;font:13px system-ui;padding:12px}header{display:flex;gap:16px;align-items:center;margin-bottom:12px}iframe{border:0;display:block;background:#111}select{padding:6px}label{display:flex;align-items:center;gap:8px}</style><header><label>Surface<select id="surface"><option value="/">Application</option><option value="/tests/notices.html">Notice fixture</option></select></label><label>Viewport<select id="viewport"><option value="320,568">320 × 568 phone</option><option value="331,518">331 × 518 compact phone</option><option value="515,515">515 × 515 compact window</option><option value="390,844">390 × 844 phone</option><option value="320,640">320 × 640 phone</option><option value="375,667">375 × 667 phone</option><option value="430,932">430 × 932 phone</option><option value="414,833">414 × 833 phone</option><option value="704,833">704 × 833 window</option><option value="768,1024">768 × 1024 tablet</option><option value="1280,800">1280 × 800 desktop</option><option value="1440,900">1440 × 900 desktop</option><option value="1920,1080">1920 × 1080 desktop</option><option value="844,390">844 × 390 landscape</option></select></label><label>Text size<select id="text-size"><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option></select></label></header><iframe title="Responsive player" src="/" width="320" height="568"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#surface').onchange=e=>frame.src=e.target.value;document.querySelector('#viewport').onchange=e=>{const [w,h]=e.target.value.split(',');frame.width=w;frame.height=h;};document.querySelector('#text-size').onchange=e=>{const d=frame.contentDocument;let sheet=d.getElementById('qa-text');if(!sheet){sheet=d.createElement('style');sheet.id='qa-text';d.head.append(sheet);}sheet.textContent='';if(e.target.value!=='100')sheet.textContent='#active-phrase{font-size:calc('+getComputedStyle(d.querySelector('#active-phrase')).fontSize+' * '+Number(e.target.value)/100+')}';};</script></html>
